name: pearlnest
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2  
  flutter_launcher_icons: "^0.14.3"
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon.png
  fullscreen: true
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/img3.jpg
    - assets/images/img4.jpg
    - assets/images/img5.jpg
    - assets/images/img6.jpg
    - assets/images/img7.jpg
    - assets/images/img8.jpg
    - assets/images/img2.jpg
    - assets/images/img1.jpg
    - assets/images/icon_2.png
    - assets/images/icon_3.png
    - assets/images/icon_4.png
    - assets/images/gojo (1).jpg
    - assets/images/gojo (2).jpg
    - assets/images/gojo (3).jpg
    - assets/images/gojo (4).jpg
    - assets/images/gojo (5).jpg
    - assets/images/gojo (6).jpg
    - assets/icon.png