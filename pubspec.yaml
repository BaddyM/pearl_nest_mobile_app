name: pearlnest
description: "A new Flutter project."

version: 1.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: "^0.14.3"
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.4
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  dio: ^5.7.0
  flutter_dotenv: ^5.1.0
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  hydrated_bloc: ^9.1.5
  http: ^1.2.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  shimmer: ^3.0.0
  webview_flutter: ^4.4.2
  app_links: ^6.3.2
  firebase_core: ^2.32.0
  socket_io_client: ^2.0.3+1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  geolocator: ^12.0.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.4
  connectivity_plus: ^6.1.0
  file_picker: ^8.1.4
  package_info_plus: ^8.0.2
  shorebird_code_push: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon.png
  fullscreen: true
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/img3.jpg
    - assets/images/img4.jpg
    - assets/images/img5.jpg
    - assets/images/img6.jpg
    - assets/images/img7.jpg
    - assets/images/img8.jpg
    - assets/images/img2.jpg
    - assets/images/img1.jpg
    - assets/images/icon_2.png
    - assets/images/icon_3.png
    - assets/images/icon_4.png
    - assets/images/gojo (1).jpg
    - assets/images/gojo (2).jpg
    - assets/images/gojo (3).jpg
    - assets/images/gojo (4).jpg
    - assets/images/gojo (5).jpg
    - assets/images/gojo (6).jpg
    - assets/icon.png
